<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>BOSS 計時器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #1a1a1a; color: #f0e6d2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 20px; }
        .channel-box { background-color: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 12px 8px; text-align: center; transition: 0.2s; }
        .channel-box:hover { background-color: #333; }
        .ch-title { font-weight: bold; margin-bottom: 6px; color: #a8d08d; font-size: 1.1em; }
        
        /* 獨立狀態顯示區塊 */
        .status-group { background: #1f1f1f; border-radius: 4px; padding: 6px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 0.85em; }
        
        /* 狀態顏色 */
        .st-dead { color: #ff6b6b; font-weight: bold; min-height: 18px; } 
        .st-spawned { color: #4ade80; font-weight: bold; min-height: 18px; } 
        .st-monitor { color: #f4b04f; min-height: 18px; } 
        .st-patrol { color: #7db0ed; min-height: 18px; }  
        .st-none { color: #666; min-height: 18px; } /* 空白未確認狀態 */
        
        .action-btns { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
        button { background: #3d3d3d; color: white; border: 1px solid #555; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 0.75em; }
        button:hover { background: #555; }
        button:active { background: #222; }
        .btn-clear { background: #6b3a3a; border-color: #884444; }
        .btn-clear:hover { background: #884444; }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 500px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>巴洛古 (重生週期 240-360 分鐘)</h2>
            <p>當前操作者：<span id="currentUser" style="color: #f4b04f;">讀取中...</span></p>
        </div>
    </div>
    <div class="grid" id="channelGrid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    // 這裡引入 update 來替換原本的 set
    import { getDatabase, ref, update, onValue, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAVPf4LDvIwdwDAOmLR5LCb2YOrHBKYQL0",
      authDomain: "boss-timer-eb97e.firebaseapp.com",
      databaseURL: "https://boss-timer-eb97e-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "boss-timer-eb97e",
      storageBucket: "boss-timer-eb97e.firebasestorage.app",
      messagingSenderId: "132421383690",
      appId: "1:132421383690:web:3dbe0a3aabbd275254d1f3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let userName = "";
    const totalChannels = 60;
    const respawnTimeMs = 240 * 60 * 1000; 
    let channelsData = {}; 
    const alertedChannels = new Set(); 

    function initChannels() {
        const grid = document.getElementById('channelGrid');
        grid.innerHTML = ""; 
        for (let i = 1; i <= totalChannels; i++) {
            const box = document.createElement('div');
            box.className = 'channel-box';
            // 將狀態區塊分成 3 行，各自獨立
            box.innerHTML = `
                <div class="ch-title">CH ${i}</div>
                <div class="status-group">
                    <div id="dead-${i}" class="st-none">- 計時未啟動 -</div>
                    <div id="monitor-${i}" class="st-none">- 無監視 -</div>
                    <div id="patrol-${i}" class="st-none">- 未巡邏 -</div>
                </div>
                <div class="action-btns">
                    <button onclick="window.setMonitor(${i})">監視</button>
                    <button onclick="window.setPatrol(${i})">巡邏</button>
                    <button onclick="window.setDead(${i})">擊殺</button>
                    <button class="btn-clear" onclick="window.clearCh(${i})">清除</button>
                </div>
            `;
            grid.appendChild(box);
        }
    }

    while (!userName || userName.trim() === "") {
        userName = prompt("請輸入您的遊戲 ID：");
    }
    document.getElementById('currentUser').innerText = userName;
    initChannels();

    // --- 使用 update 只更新特定欄位，互不覆蓋 ---

    window.setMonitor = (ch) => {
        // 只更新 monitor 欄位
        update(ref(db, 'channels/' + ch), { monitor: `${userName} 監視中` });
    };

    window.setPatrol = (ch) => {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        // 只更新 patrol 欄位
        update(ref(db, 'channels/' + ch), { patrol: `${timeStr} 巡邏過` });
    };

    window.setDead = (ch) => {
        alertedChannels.delete(ch);
        const targetTime = Date.now() + respawnTimeMs;
        // 只更新倒數時間欄位
        update(ref(db, 'channels/' + ch), { targetTime: targetTime });
    };

    // 清除按鈕 (把該頻道的所有狀態歸零)
    window.clearCh = (ch) => {
        alertedChannels.delete(ch);
        set(ref(db, 'channels/' + ch), { monitor: null, patrol: null, targetTime: null });
    };

    // --- 監聽資料庫，各自更新對應的文字 ---
    onValue(ref(db, 'channels'), (snapshot) => {
        const data = snapshot.val() || {};
        channelsData = data;
        
        for (let i = 1; i <= totalChannels; i++) {
            const chData = data[i] || {};
            
            // 處理監視狀態
            const monDiv = document.getElementById(`monitor-${i}`);
            if (chData.monitor) {
                monDiv.className = 'st-monitor'; monDiv.innerText = chData.monitor;
            } else {
                monDiv.className = 'st-none'; monDiv.innerText = '- 無監視 -';
            }

            // 處理巡邏狀態
            const patDiv = document.getElementById(`patrol-${i}`);
            if (chData.patrol) {
                patDiv.className = 'st-patrol'; patDiv.innerText = chData.patrol;
            } else {
                patDiv.className = 'st-none'; patDiv.innerText = '- 未巡邏 -';
            }

            // 如果沒有計時，顯示未啟動
            if (!chData.targetTime) {
                const deadDiv = document.getElementById(`dead-${i}`);
                deadDiv.className = 'st-none'; 
                deadDiv.innerText = '- 計時未啟動 -';
            }
        }
    });

    // --- 本地計時器 (只管倒數的那一行) ---
    setInterval(() => {
        const now = Date.now();
        for (let i = 1; i <= totalChannels; i++) {
            const chData = channelsData[i] || {};
            if (chData.targetTime) {
                const deadDiv = document.getElementById(`dead-${i}`);
                const remainMs = chData.targetTime - now;

                if (remainMs <= 0) {
                    deadDiv.className = 'st-spawned';
                    deadDiv.innerText = '已重生 / 可擊殺';
                } else {
                    const remainMins = Math.floor(remainMs / 60000);
                    const remainSecs = Math.floor((remainMs % 60000) / 1000);
                    deadDiv.className = 'st-dead';
                    deadDiv.innerText = `重生倒數: ${remainMins}分 ${remainSecs}秒`;

                    if (remainMs <= 5 * 60 * 1000 && !alertedChannels.has(i)) {
                        alertedChannels.add(i);
                        alert(`【注意】CH ${i} 的 BOSS 將在 5 分鐘內重生！`);
                    }
                }
            }
        }
    }, 1000);
</script>
</body>
</html>
